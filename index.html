<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Seonghyeon</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}


/* =========================
   INTRO
========================= */

#intro {

    position: fixed;
    inset: 0;

    z-index: 1000;

    background: #000;

    display: flex;
    justify-content: center;
    align-items: center;

    transition:
        transform 1s ease-in-out,
        opacity 1s ease-in-out;

}


/* =========================
   INTRO IMAGE
========================= */

#intro img {

    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 0;

}


/* =========================
   NAME BOX
========================= */

.nameBox {

    position: relative;

    z-index: 10;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 15px;

    padding: 30px;

    text-align: center;

}


.nameBox h2 {

    color: white;

    font-family:
        Arial,
        sans-serif;

    font-size:
        clamp(24px, 4vw, 45px);

    text-shadow:
        0 0 10px white,
        0 0 25px #ff8bd8,
        0 0 40px #ff4fc3;

}


.nameBox p {

    color: white;

    font-family: Arial, sans-serif;

    font-size: 18px;

}


/* =========================
   INPUT
========================= */

#nameInput {

    width: min(
        350px,
        80vw
    );

    padding: 15px 20px;

    border: none;

    outline: none;

    border-radius: 30px;

    background:
        rgba(
            255,
            255,
            255,
            0.9
        );

    color: #333;

    font-size: 18px;

    text-align: center;

}


/* =========================
   BUTTON
========================= */

#startButton {

    padding:
        12px
        30px;

    border: none;

    border-radius: 30px;

    background: white;

    color: #ff4fc3;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.2s,
        box-shadow 0.2s;

}


#startButton:hover {

    transform: scale(1.08);

    box-shadow:
        0 0 20px
        rgba(
            255,
            255,
            255,
            0.8
        );

}


/* =========================
   HIDE INTRO
========================= */

#intro.hide {

    transform:
        translateY(-100%);

    opacity: 0;

    pointer-events: none;

}


/* =========================
   FIREWORK CANVAS
========================= */

#fireworks {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 400;

    pointer-events: none;

}


/* =========================
   BIRTHDAY TEXT
========================= */

#birthdayText {

    position: fixed;

    z-index: 900;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%)
        scale(0);

    width: 100%;

    color: white;

    text-align: center;

    font-family:
        Arial,
        sans-serif;

    font-size:
        clamp(
            30px,
            6vw,
            90px
        );

    font-weight: 900;

    line-height: 1.15;

    letter-spacing: 3px;

    opacity: 0;

    text-shadow:
        0 0 10px white,
        0 0 25px #ff8bd8,
        0 0 50px #ff4fc3;

}


/* =========================
   TEXT POP
========================= */

#birthdayText.show {

    animation:
        textPop 1.5s
        cubic-bezier(
            .17,
            .67,
            .25,
            1.3
        )
        forwards;

}


@keyframes textPop {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;

    }

    60% {

        transform:
            translate(-50%, -50%)
            scale(1.15);

        opacity: 1;

    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 1;

    }

}

</style>

</head>


<body>


<!-- =========================
     INTRO
========================= -->

<div id="intro">


    <!-- JPEG INTRO -->

    <img
        src="intro.JPG"
        alt="Intro"
    >


    <!-- NAME INPUT -->

    <div class="nameBox">

        <h2>
            Welcome!
        </h2>

        <p>
            What's your name?
        </p>


        <input
            id="nameInput"
            type="text"
            placeholder="Enter your name..."
            autocomplete="off"
        >


        <button
            id="startButton"
        >
            ENTER ✨
        </button>

    </div>

</div>


<!-- =========================
     FIREWORKS
========================= -->

<canvas id="fireworks"></canvas>


<!-- =========================
     BIRTHDAY TEXT
========================= -->

<div id="birthdayText"></div>


<script>


/* =========================
   ELEMENTS
========================= */

const intro =
    document.getElementById(
        "intro"
    );


const nameInput =
    document.getElementById(
        "nameInput"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const birthdayText =
    document.getElementById(
        "birthdayText"
    );


/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById(
        "fireworks"
    );


const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   FIREWORK DATA
========================= */

let fireworks = [];

let particles = [];


/* =========================
   FIREWORK
========================= */

class Firework {

    constructor() {

        this.x =
            Math.random()
            * canvas.width;

        this.y =
            canvas.height;

        this.targetY =
            Math.random()
            * canvas.height
            * 0.45
            +
            canvas.height
            * 0.1;

        this.speed =
            7 +
            Math.random() * 4;

        this.exploded =
            false;

    }


    update() {

        this.y -= this.speed;


        if (
            this.y <=
            this.targetY
        ) {

            this.explode();

            this.exploded =
                true;

        }

    }


    explode() {

        const amount = 100;


        for (
            let i = 0;
            i < amount;
            i++
        ) {

            const angle =
                Math.PI * 2
                * i
                / amount;


            const speed =
                Math.random()
                * 6
                + 2;


            particles.push(

                new Particle(

                    this.x,

                    this.y,

                    Math.cos(angle)
                    * speed,

                    Math.sin(angle)
                    * speed

                )

            );

        }

    }


    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            2,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "white";

        ctx.fill();

    }

}


/* =========================
   PARTICLE
========================= */

class Particle {

    constructor(
        x,
        y,
        vx,
        vy
    ) {

        this.x = x;

        this.y = y;

        this.vx = vx;

        this.vy = vy;

        this.life = 1;

        this.gravity =
            0.04;

    }


    update() {

        this.x += this.vx;

        this.y += this.vy;

        this.vy +=
            this.gravity;

        this.vx *= 0.98;

        this.vy *= 0.98;

        this.life -= 0.012;

    }


    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            2,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${this.life}
            )`;


        ctx.shadowBlur = 15;

        ctx.shadowColor =
            "white";


        ctx.fill();


        ctx.shadowBlur = 0;

    }

}


/* =========================
   ANIMATION
========================= */

function animate() {


    ctx.fillStyle =
        "rgba(0,0,0,0.2)";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    fireworks.forEach(
        (firework, index) => {

            firework.update();

            firework.draw();


            if (
                firework.exploded
            ) {

                fireworks.splice(
                    index,
                    1
                );

            }

        }
    );


    particles.forEach(
        (particle, index) => {

            particle.update();

            particle.draw();


            if (
                particle.life <= 0
            ) {

                particles.splice(
                    index,
                    1
                );

            }

        }
    );


    requestAnimationFrame(
        animate
    );

}


animate();


/* =========================
   START WEBSITE
========================= */

function startWebsite() {


    /* LẤY TÊN */

    const name =
        nameInput.value.trim();


    /* KHÔNG NHẬP TÊN */

    if (!name) {

        nameInput.focus();

        nameInput.placeholder =
            "Please enter your name ✨";

        return;

    }


    /* HIỆN LỜI CHÚC */

    birthdayText.innerHTML =
        `
        HAPPY BIRTHDAY<br>
        ${name}!
        `;


    /* ẨN INTRO */

    intro.classList.add(
        "hide"
    );


    /* HIỆN TEXT */

    birthdayText.classList.add(
        "show"
    );


    /* PHÁO HOA BAN ĐẦU */

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        setTimeout(() => {

            fireworks.push(
                new Firework()
            );

        }, i * 220);

    }


    /* PHÁO HOA LIÊN TỤC */

    setInterval(() => {

        fireworks.push(
            new Firework()
        );

    }, 900);

}


/* =========================
   BUTTON CLICK
========================= */

startButton.addEventListener(
    "click",
    startWebsite
);


/* =========================
   ENTER KEY
========================= */

nameInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key ===
            "Enter"
        ) {

            startWebsite();

        }

    }
);

</script>


</body>

</html>
