<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday, Seonghyeon!</title>

<!-- Handwriting / Calligraphy font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06152f;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.message {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 5;
    pointer-events: none;

    opacity: 0;
    transition: opacity 2s ease;
}

.message.show {
    opacity: 1;
}

.message h1 {
    color: white;

    font-family: "Allura", cursive;

    font-size: clamp(55px, 9vw, 120px);

    font-weight: 400;

    letter-spacing: 2px;

    text-align: center;

    text-shadow:
        0 0 8px rgba(255,255,255,.8),
        0 0 25px rgba(130,180,255,.7),
        0 0 50px rgba(80,140,255,.45);
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="message" id="message">
    <h1>Happy Birthday, Seonghyeon!</h1>
</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W;
let H;

function resize() {

    W = canvas.width =
        window.innerWidth *
        devicePixelRatio;

    H = canvas.height =
        window.innerHeight *
        devicePixelRatio;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.scale(
        devicePixelRatio,
        devicePixelRatio
    );

    W = window.innerWidth;
    H = window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================
   FIREWORK PARTICLES
===================================== */

let fireworks = [];


class Spark {

    constructor(
        x,
        y,
        angle,
        speed,
        hue
    ) {

        this.x = x;
        this.y = y;

        this.vx =
            Math.cos(angle) * speed;

        this.vy =
            Math.sin(angle) * speed;

        this.life = 1;

        this.decay =
            Math.random() *
            0.012 +
            0.006;

        this.size =
            Math.random() *
            1.8 +
            .6;

        this.hue = hue;
    }


    update() {

        this.x += this.vx;

        this.y += this.vy;

        this.vx *= .985;

        this.vy *= .985;

        /*
        Gravity
        */

        this.vy += .025;

        this.life -= this.decay;
    }


    draw() {

        if (this.life <= 0)
            return;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `hsla(
                ${this.hue},
                90%,
                75%,
                ${this.life}
            )`;

        ctx.shadowBlur = 12;

        ctx.shadowColor =
            `hsl(${this.hue},100%,75%)`;

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}


/* =====================================
   CREATE FIREWORK
===================================== */

function createFirework() {

    /*
    Fireworks appear
    all over the sky
    */

    const x =
        Math.random() * W;

    const targetY =
        H * (.12 + Math.random() * .58);

    const startY =
        H + 10;

    const hue =
        Math.random() * 360;

    /*
    Rocket
    */

    let rocket = {

        x: x,

        y: startY,

        targetY: targetY,

        speed:
            7 + Math.random() * 4,

        hue: hue

    };

    fireworks.push(rocket);
}


/* =====================================
   EXPLOSION
===================================== */

function explode(
    x,
    y,
    hue
) {

    const amount =
        120 + Math.random() * 100;

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            Math.random() *
            5 +
            2;

        fireworks.push(
            new Spark(
                x,
                y,
                angle,
                speed,
                hue +
                Math.random() * 35 -
                17
            )
        );
    }
}


/* =====================================
   ANIMATION
===================================== */

function animate() {

    /*
    Dark blue night sky
    */

    ctx.fillStyle =
        "rgba(6,21,47,.22)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
    Update fireworks
    */

    fireworks =
        fireworks.filter(
            f => {

                /*
                Rocket
                */

                if (
                    f instanceof Spark
                ) {

                    f.update();
                    f.draw();

                    return f.life > 0;
                }


                /*
                Rocket reaches
                explosion height
                */

                f.y -= f.speed;

                /*
                Small rocket trail
                */

                ctx.beginPath();

                ctx.arc(
                    f.x,
                    f.y,
                    2,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `hsla(
                        ${f.hue},
                        100%,
                        85%,
                        .9
                    )`;

                ctx.shadowBlur = 15;

                ctx.shadowColor =
                    "white";

                ctx.fill();

                ctx.shadowBlur = 0;


                if (
                    f.y <= f.targetY
                ) {

                    explode(
                        f.x,
                        f.y,
                        f.hue
                    );

                    return false;
                }

                return true;

            }
        );


    requestAnimationFrame(
        animate
    );
}


/* =====================================
   CONSTANT FIREWORKS
===================================== */

animate();


/*
Many fireworks
across the screen
*/

setInterval(
    () => {

        createFirework();

        /*
        Sometimes launch
        multiple fireworks
        */

        if (
            Math.random() > .55
        ) {
            setTimeout(
                createFirework,
                180
            );
        }

        if (
            Math.random() > .75
        ) {
            setTimeout(
                createFirework,
                350
            );
        }

    },
    550
);


/* =====================================
   BIRTHDAY MESSAGE
===================================== */

setTimeout(
    () => {

        document
            .getElementById("message")
            .classList
            .add("show");

    },
    2500
);


/* =====================================
   CLICK = EXTRA FIREWORK
===================================== */

document.addEventListener(
    "click",
    e => {

        explode(
            e.clientX,
            e.clientY,
            Math.random() * 360
        );

    }
);

</script>

</body>
</html>
